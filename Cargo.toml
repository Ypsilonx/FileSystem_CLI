[package]
name = "FileSystem_CLI"
version = "0.1.0"
edition = "2024"

[dependencies]
# Pro zpracování argumentů v příkazové řádce
clap = { version = "4.6", features = ["derive"] }
# Pro krásné formátování času
chrono = "0.4.44"
# Progress bar / spinner
indicatif = "0.18"
# Interaktivní menu, vstupy, potvrzení
dialoguer = "0.12"
# Barevný výstup v terminálu + clear screen
console = "0.16"